version: 2

updates:
  # SDK npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # One PR a week for minor/patch dev dependency updates
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Same for production dependencies
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Keep the actions pinned in the CI workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
